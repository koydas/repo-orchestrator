[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-orchestrator"
version = "0.1.0"
description = "Cross-repository coherence engine (M1 baseline scan, M2 PR impact, M3 bounded investigation): read-only, pinned, evidence-backed."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# M3 (ADR-0016): LangGraph is confined to investigation/workflow.py and pinned (S0 results: upgrade-sensitive behaviour).
investigation = [
    "langgraph==1.2.19",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langgraph-prebuilt==1.1.1",
    "langchain-core==1.7.3",
    "pydantic==2.14.2",
]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1", "types-PyYAML==6.0.12.20261030"]

[project.scripts]
repo-orchestrator = "repo_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/repo_orchestrator"]
