name: M1 deterministic baseline

# Production CI for the M1 package (src/, declarations/, tests/). Fully offline: the evaluation runs on committed,
# pinned fixtures. The S0 spike keeps its own workflow (spike-langgraph.yml) and is not run here.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "declarations/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/workflows/m1.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "declarations/**"
      - "docs/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      live_scan:
        description: "Also run a live, read-only scan of the six repositories (not part of the default gate)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Static checks
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check (strict)
        run: mypy
      - name: Unit tests, offline baseline evaluation, documentation and architecture checks
        run: pytest
      - name: Offline baseline scan (CLI smoke test)
        run: |
          set +e
          repo-orchestrator scan --revisions baseline --offline --cache-dir tests/fixtures/baseline \
            --as-of 2026-11-02 --no-store --output-dir "$RUNNER_TEMP/m1-report"
          code=$?
          echo "exit code: $code (1 = complete evaluation with the two documented baseline findings)"
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: m1-baseline-report-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/m1-report

  live-scan:
    # Optional, read-only, on demand. An exit code of 0, 1 or 2 is a result; 3 is a failure.
    if: github.event_name == 'workflow_dispatch' && inputs.live_scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Live scan of the six public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          repo-orchestrator scan --no-store --output-dir "$RUNNER_TEMP/m1-live"
          code=$?
          test "$code" -le 2
      - uses: actions/upload-artifact@v4
        with:
          name: m1-live-report
          path: ${{ runner.temp }}/m1-live
