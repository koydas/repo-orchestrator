# P7 (docs/coherence-model.md → MVP policy catalog) and the intent reviews of the Investigator (M3, ADR-0015). Read only by
# `scan --investigate`; the deterministic scan (M1, M2) never loads this file. No declaration, no candidate: a claim that is
# not declared here is never investigated (no policy, no finding). Locators are regular expressions over single lines of
# the pinned files; a locator that no longer matches makes its candidate `insufficient_evidence` (claim_not_found), never a pass.
version: 1
policy: {id: P7, version: "1.0.0"}
claims:
  - id: H2
    baseline: H2
    relationship: R1.ap
    subject: "claim:extracted_from"
    question: >-
      The profile README says of agent-patterns "N extracted from the two repos above". agent-patterns' own README describes
      how many of its patterns have implementations in public repositories and how many link the incident that forced them.
      Does the profile's phrase agree with what agent-patterns says about itself? Locate and quote both statements.
    claimant: {repo: profile, path: README.md, line_regex: '^\| \[`agent-patterns`\]', phrase_regex: '\d+ extracted from'}
    upstream:
      - {repo: ap, path: README.md, line_regex: 'have implementations in public repos'}
    # No `entailment` and the default impact (falsifies): a qualitative claim, validated by a human (baseline H2).
intent_reviews:
  - id: H1
    baseline: H1
    policy: P6
    relationships: [R5.chat, R5.homelab]
    statuses: [policy_clarification]
    question: >-
      The deterministic policy cannot say whether this repository is inside the scope of ai-dev-tools ADR-018 ("every
      repository worked on with Claude Code", open question Q1). Does the repository state, in its own documents, that it is
      outside that scope or that it intentionally does not declare the plugin? Propose an intent only with a verified quote.
