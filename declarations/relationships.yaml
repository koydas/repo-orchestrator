  - id: R10
    baseline: R10
    type: conceptual
    source: adl
    target: chat
    origin: declared
    description: "ollama-chat's new-adr skill is modeled after autonomous-dev-loop's."
    evidence: "chat .claude/skills/new-adr/SKILL.md:80"
  - id: R11
    baseline: R11
